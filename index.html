  <script>
    // Aplica o tema antes do primeiro paint, evitando o flash de cores.
    // O idioma vem da rota: "/" é pt-BR e "/en/" é en-US. Quem escolheu inglês antes é levado para "/en/".
    (function () {
      var root = document.documentElement, mode = "system", pref = null;
      try { mode = localStorage.getItem("mode") || "system"; pref = localStorage.getItem("lang"); } catch (e) {}
      if (pref === "en-US" && root.lang === "pt-BR" && location.pathname === "/") {
        location.replace("/en/" + location.hash);
      }
      root.classList.add("js");
      window.THEMES.applyTheme(window.SITE_CONFIG.palette, mode);
    })();
  </script>
