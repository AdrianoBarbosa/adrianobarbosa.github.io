name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Atualiza a lista de repositórios
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update-repos.sh "${{ github.repository_owner }}" || echo "Falhou, mantendo o repos.json versionado"

      - name: Monta e pré-renderiza o site
        env:
          CHROME: google-chrome
        run: python3 scripts/build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
